nts="196.2,330.0 199.1,337.0 206.7,337.6 200.9,342.5 202.7,349.9 196.2,345.9 189.7,349.9 191.5,342.5 185.7,337.6 193.3,337.0" fill="#F59E0B"/><g transform="translate(40 420)"><circle cx="15" cy="15" r="15" fill="#0E7C7B"/><path d="M8.4 15.600000000000001l4.5 4.5 9-9.6" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84" y="442" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F3A">Same request to every patient</text><g transform="translate(40 472)"><circle cx="15" cy="15" r="15" fill="#0E7C7B"/><path d="M8.4 15.600000000000001l4.5 4.5 9-9.6" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84" y="494" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F3A">No discounts or gifts for reviews</text><g transform="translate(40 524)"><circle cx="15" cy="15" r="15" fill="#0E7C7B"/><path d="M8.4 15.600000000000001l4.5 4.5 9-9.6" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84" y="546" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F3A">Never confirm care in public replies</text>
