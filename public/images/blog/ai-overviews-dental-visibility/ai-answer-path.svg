<text x="60" y="98" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B1F3A" text-anchor="start">How a dental practice ends up cited in an AI answer</text>

