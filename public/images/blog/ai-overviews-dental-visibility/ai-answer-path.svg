font-weight="400" fill="#3B4757" text-anchor="start">Eligible to show in</text><text x="362.5" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Google with a snippet.</text><path d="M589 101.5h20" stroke="#E4570F" stroke-width="3"/><path d="M603 94.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="617" y="0" width="244.5" height="203" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="617" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="661" cy="48" r="22" fill="#0B1F3A"/><text x="661" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="641" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Clear &amp; trusted</text><text x="641" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Direct answers,</text><text x="641" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">consistent data, named</text><text x="641" y="181.16" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">experts.</text><path d="M867.5 101.5h20" stroke="#E4570F" stroke-width="3"/><path d="M881.5 94.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="895.5" y="0" width="244.5" height="203" rx="16" fill="#0B1F3A" stroke="#0B1F3A"/><rect x="895.5" y="0" width="244.5" height="6" rx="3" fill="#E4570F"/><circle cx="939.5" cy="48" r="22" fill="#E4570F"/><text x="939.5" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="919.5" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Cited</text><text x="919.5" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">Used as a supporting</text><text x="919.5" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">link — never</text><text x="919.5" y="181.16" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">guaranteed.</text></g>
