<text x="116" y="47" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#C2410C">CONTENT STRUCTURE</text>
<text x="60" y="98" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B1F3A" text-anchor="start">The section structure AI search can use</text>

<g transform="translate(0 136)"><rect x="60" y="0" width="252" height="167" rx="16" fill="#fff" stroke="#E2E7EE" stroke-width="2"/><rect x="84" y="22" width="35" height="28" rx="14" fill="#E6F4F3"/><text x="101.5" y="41" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#0E7C7B" text-anchor="middle">1</text><text x="84" y="84" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Question heading</text><text x="84" y="115" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Phrased the way patients</text><text x="84" y="137.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">ask.</text><rect x="336" y="0" width="252" height="167" rx="16" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><rect x="360" y="22" width="35" height="28" rx="14" fill="#E4570F"/><text x="377.5" y="41" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#fff" text-anchor="middle">2</text><text x="360" y="84" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Direct answer</text><text x="360" y="115" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">Two to three sentences,</text><text x="360" y="137.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">first.</text><rect x="612" y="0" width="252" height="167" rx="16" fill="#fff" stroke="#E2E7EE" stroke-width="2"/><rect x="636" y="22" width="35" height="28" rx="14" fill="#E6F4F3"/><text x="653.5" y="41" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#0E7C7B" text-anchor="middle">3</text><text x="636" y="84" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Supporting detail</text><text x="636" y="115" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Steps, tables, costs and</text><text x="636" y="137.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">caveats.</text><rect x="888" y="0" width="252" height="167" rx="16" fill="#FFF5EE" stroke="#F3C3A6" stroke-width="2"/><rect x="912" y="22" width="35" height="28" rx="14" fill="#C2410C"/><text x="929.5" y="41" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#fff" text-anchor="middle">4</text><text x="912" y="84" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Clear authorship</text><text x="912" y="115" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Named author and</text><text x="912" y="137.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">clinical reviewer.</text></g>
