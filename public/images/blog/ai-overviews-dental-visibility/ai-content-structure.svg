<title id="t">The section structure AI search can use</title><desc id="d">Infographic of a four-part content structure for dental pages: question heading, direct answer, supporting detail and clear authorship.</desc>
<rect width="1200" height="373" rx="24" fill="#FFFFFF"/>
<rect x="1" y="1" width="1198" height="371" rx="23" fill="none" stroke="#E2E7EE" stroke-width="2"/>
