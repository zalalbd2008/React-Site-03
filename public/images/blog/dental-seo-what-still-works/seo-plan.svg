<g transform="translate(0 136)"><rect x="60" y="0" width="337.3333333333333" height="181" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="60" y="0" width="337.3333333333333" height="6" rx="3" fill="#0E7C7B"/><circle cx="104" cy="48" r="22" fill="#0B1F3A"/><text x="104" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="84" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Install measurement</text><text x="84" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Search Console, analytics events</text><text x="84" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">and call tracking by source.</text><path d="M403.3333333333333 90.5h20" stroke="#E4570F" stroke-width="3"/><path d="M417.3333333333333 83.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="431.3333333333333" y="0" width="337.3333333333333" height="181" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="431.3333333333333" y="0" width="337.3333333333333" height="6" rx="3" fill="#0E7C7B"/><circle cx="475.3333333333333" cy="48" r="22" fill="#0B1F3A"/><text x="475.3333333333333" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="455.3333333333333" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Check indexing</text><text x="455.3333333333333" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Every key page indexed once; no</text><text x="455.3333333333333" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">staging or duplicate pages.</text><path d="M774.6666666666666 90.5h20" stroke="#E4570F" stroke-width="3"/><path d="M788.6666666666666 83.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="802.6666666666666" y="0" width="337.3333333333333" height="181" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="802.6666666666666" y="0" width="337.3333333333333" height="6" rx="3" fill="#0E7C7B"/><circle cx="846.6666666666666" cy="48" r="22" fill="#0B1F3A"/><text x="846.6666666666666" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="826.6666666666666" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Fix the Business Profile</text><text x="826.6666666666666" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Name, categories, hours, services</text><text x="826.6666666666666" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">and real photos.</text><rect x="60" y="209" width="337.3333333333333" height="208" rx="16" fill="#0B1F3A" stroke="#0B1F3A"/><rect x="60" y="209" width="337.3333333333333" height="6" rx="3" fill="#E4570F"/><circle cx="104" cy="257" r="22" fill="#E4570F"/><text x="104" y="264" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="84" y="313" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Rebuild top treatment</text><text x="84" y="339.88" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">pages</text><text x="84" y="373" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">Start with your highest-production</text><text x="84" y="395.08" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">procedures.</text><path d="M403.3333333333333 313h20" stroke="#E4570F" stroke-width="3"/><path d="M417.3333333333333 306l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="431.3333333333333" y="209" width="337.3333333333333" height="208" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="431.3333333333333" y="209" width="337.3333333333333" height="6" rx="3" fill="#0E7C7B"/><circle cx="475.3333333333333" cy="257" r="22" fill="#0B1F3A"/><text x="475.3333333333333" y="264" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="455.3333333333333" y="313" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Strengthen provider bios</text><text x="455.3333333333333" y="346" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Credentials, training, memberships</text><text x="455.3333333333333" y="368.08" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start"