<text x="60" y="98" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B1F3A" text-anchor="start">A four-step privacy check before posting patient content</text>

<g transform="translate(0 136)"><rect x="60" y="0" width="244.5" height="230" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="60" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="104" cy="48" r="22" fill="#0B1F3A"/><text x="104" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="84" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Authorization</text><text x="84" y="130.88" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">signed</text><text x="84" y="164" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">HIPAA-compliant,</text><text x="84" y="186.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">covering this use and</text><text x="84" y="208.16" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">platform.</text><path d="M310.5 115h20" stroke="#E4570F" stroke-width="3"/><path d="M324.5 108l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="338.5" y="0" width="244.5" height="230" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="338.5" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="382.5" cy="48" r="22" fill="#0B1F3A"/><text x="382.5" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="362.5" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Background clear</text><text x="362.5" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">No other patients,</text><text x="362.5" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">charts or screens.</text><path d="M589 115h20" stroke="#E4570F" stroke-width="3"/><path d="M603 108l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="617" y="0" width="244.5" height="230" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="617" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="661" cy="48" r="22" fill="#0B1F3A"/><text x="661" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="641" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Minors protected</text><text x="641" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Parent or guardian</text><text x="641" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">authorization.</text><path d="M867.5 115h20" stroke="#E4570F" stroke-width="3"/><path d="M881.5 108l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="895.5" y="0" width="244.5" height="230" rx="16" fill="#0B1F3A" stroke="#0B1F3A"/><rect x="895.5" y="0" width="244.5" height="6" rx="3" fill="#E4570F"/><circle cx="939.5" cy="48" r="22" fill="#E4570F"/><text x="939.5" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="919.5" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Approve &amp; post</text><text x="919.5" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">Privacy-trained</text><text x="919.5" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">reviewer signs off.</text></g>
