<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 409" width="1200" height="409" role="img" aria-labelledby="t d">
<title id="t">A compliant daily review routine for dental practices</title><desc id="d">Four-step review routine infographic for dentists: ask at checkout, send one message, one reminder, reply without health details.</desc>
<rect width="1200" height="409" rx="24" fill="#FFFFFF"/>
<rect x="1" y="1" width="1198" height="407" rx="23" fill="none" stroke="#E2E7EE" stroke-width="2"/>
<rect x="60" y="40" width="44" height="6" rx="3" fill="#E4570F"/>
<text x="116" y="47" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#C2410C">DAILY ROUTINE</text>
<text x="60" y="98" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B1F3A" text-anchor="start">A compliant daily review routine for dental practices</text>

<g transform="translate(0 136)"><rect x="60" y="0" width="244.5" height="203" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="60" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="104" cy="48" r="22" fill="#0B1F3A"/><text x="104" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="84" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Ask at checkout</text><text x="84" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">A consistent verbal ask</text><text x="84" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">for every patient.</text><path d="M310.5 101.5h20" stroke="#E4570F" stroke-width="3"/><path d="M324.5 94.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="338.5" y="0" width="244.5" height="203" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="338.5" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="382.5" cy="48" r="22" fill="#0B1F3A"/><text x="382.5" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="362.5" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Send one message</text><text x="362.5" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Same day or next</text><text x="362.5" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">morning, with consent</text><text x="362.5" y="181.16" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">and opt-out.</text><path d="M589 101.5h20" stroke="#E4570F" stroke-width="3"/><path d="M603 94.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="617" y="0" width="244.5" height="203" rx="16" fill="#F6F8FB" stroke="#E2E7EE"/><rect x="617" y="0" width="244.5" height="6" rx="3" fill="#0E7C7B"/><circle cx="661" cy="48" r="22" fill="#0B1F3A"/><text x="661" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="641" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">One reminder max</text><text x="641" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">Persistence beyond that</text><text x="641" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B4757" text-anchor="start">annoys patients.</text><path d="M867.5 101.5h20" stroke="#E4570F" stroke-width="3"/><path d="M881.5 94.5l8 7-8 7" fill="none" stroke="#E4570F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="895.5" y="0" width="244.5" height="203" rx="16" fill="#0B1F3A" stroke="#0B1F3A"/><rect x="895.5" y="0" width="244.5" height="6" rx="3" fill="#E4570F"/><circle cx="939.5" cy="48" r="22" fill="#E4570F"/><text x="939.5" y="55" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="919.5" y="104" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Reply safely</text><text x="919.5" y="137" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">Thank warmly; never</text><text x="919.5" y="159.07999999999998" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">confirm care or</text><text x="919.5" y="181.16" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D3E0" text-anchor="start">details.</text></g>
