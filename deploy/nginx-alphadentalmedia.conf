# /etc/nginx/sites-available/alphadentalmedia.conf
# Static prerendered site + /api/lead proxied to the Node lead server (systemd: alpha-lead).
# Certbot (python3-certbot-nginx) adds the 443/SSL blocks automatically — see deploy/VPS-DEPLOY.md.

limit_req_zone $binary_remote_addr zone=lead_api:10m rate=10r/m;

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.alphadentalmedia.com;
    return 301 $scheme://alphadentalmedia.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name alphadentalmedia.com;

    root /var/www/alphadentalmedia/current/dist/client;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;               # never show "Index of /" again
    client_max_body_size 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Security headers (snippet: deploy/nginx-security-headers.conf)
    include /etc/nginx/snippets/alphadentalmedia-headers.conf;
    absolute_redirect off;       # relative redirects (/about → /about/)

    # Hashed build assets: cache for a year
    location /assets/ {
        include /etc/nginx/snippets/alphadentalmedia-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Lead form API → Node service on localhost
    location /api/ {
        limit_req zone=lead_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Pages: /about → /about/ (Nginx adds the slash for directories), /about/ → about/index.html
    location / {
        include /etc/nginx/snippets/alphadentalmedia-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Hidden files (.git, .env) are never served
    location ~ /\. { deny all; return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
